name: allimation
description: "Aplikasi Irigasi Bawang - Real-time MQTT Sensor Monitoring & Pump Control"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.5.0
  provider: ^6.1.2
  fl_chart: ^0.70.2
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.2
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/agriflow_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/agriflow_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
